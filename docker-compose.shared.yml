# Shared local-only Ollama service. No host port exposure.
# Both production and development environments connect to this service.

services:
  ollama-shared:
    image: ollama/ollama:latest
    container_name: momiji-ollama-shared
    environment:
      - OLLAMA_NO_CLOUD=1
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_NUM_PARALLEL=1
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-9g}
    volumes:
      - ollama_shared_data:/root/.ollama
    networks:
      - momiji-llm-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama_shared_data:
    name: momiji-ollama-shared-data

networks:
  momiji-llm-network:
    name: momiji-llm-network
    driver: bridge
    # Ollama is only accessible within this network.
