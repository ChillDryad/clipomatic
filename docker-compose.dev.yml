# Development environment — standalone application stack
# Frontend: http://localhost:7861
# Workspace: ./workspace-dev
# LLM access: isolated Ollama on momiji-llm-network (no host port)
# Use with: ./scripts/start-dev.sh

services:
  momiji-clipper-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.10-slim
    container_name: momiji-clipper-dev
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    environment:
      - WORKSPACE_DIR=/app/workspace
      - RAM_TIER=${RAM_TIER:-standard}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - LLM_BASE_URL=http://ollama-shared:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=${LLM_MODEL:-gemma3:latest}
      - HIGHLIGHT_FALLBACK_MODEL=${HIGHLIGHT_FALLBACK_MODEL:-gemma3:latest}
      - LOCAL_LLM_MODELS=${LOCAL_LLM_MODELS:-gemma3:latest,gemma4:12b}
      - VISION_MODEL=${VISION_MODEL:-gemma3:latest}
      - VISION_SCAN_FPS=${VISION_SCAN_FPS:-0.25}
      - VISION_WINDOW_SECONDS=${VISION_WINDOW_SECONDS:-60}
      - VISION_MAX_FRAMES=${VISION_MAX_FRAMES:-180}
      - VISION_BATCH_SIZE=${VISION_BATCH_SIZE:-4}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_KEY_DIR=/app/workspace/.keys
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
      - CELERY_BROKER_URL=redis://redis-dev:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-dev:6379/1
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
    volumes:
      - ./workspace-dev:/app/workspace
    networks:
      - momiji-dev-net
      - momiji-llm-network
    depends_on:
      redis-dev:
        condition: service_healthy
    restart: unless-stopped

  redis-dev:
    image: redis:7-alpine
    container_name: momiji-redis-dev
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    mem_limit: ${REDIS_MEMORY_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - momiji-dev-net
    restart: unless-stopped

  celery-worker-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.10-slim
    container_name: momiji-celery-dev
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-1} --max-memory-per-child=${CELERY_MAX_MEMORY_KB:-2621440}
    mem_limit: ${CELERY_MEMORY_LIMIT:-3g}
    environment:
      - WORKSPACE_DIR=/app/workspace
      - RAM_TIER=${RAM_TIER:-standard}
      - CELERY_BROKER_URL=redis://redis-dev:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-dev:6379/1
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - LLM_BASE_URL=http://ollama-shared:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=${LLM_MODEL:-gemma3:latest}
      - HIGHLIGHT_FALLBACK_MODEL=${HIGHLIGHT_FALLBACK_MODEL:-gemma3:latest}
      - LOCAL_LLM_MODELS=${LOCAL_LLM_MODELS:-gemma3:latest,gemma4:12b}
      - VISION_MODEL=${VISION_MODEL:-gemma3:latest}
      - VISION_SCAN_FPS=${VISION_SCAN_FPS:-0.25}
      - VISION_WINDOW_SECONDS=${VISION_WINDOW_SECONDS:-60}
      - VISION_MAX_FRAMES=${VISION_MAX_FRAMES:-180}
      - VISION_BATCH_SIZE=${VISION_BATCH_SIZE:-4}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_KEY_DIR=/app/workspace/.keys
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
      # Cloud LLM for highlight detection (host Ollama with cloud models)
      - LLM_ALLOW_CLOUD=1
      - HIGHLIGHT_LLM_BASE_URL=http://ollama-shared:11434/v1
      - HIGHLIGHT_LLM_API_KEY=ollama
      - HIGHLIGHT_LLM_MODEL=gemma4:12b
    volumes:
      - ./workspace-dev:/app/workspace
    networks:
      - momiji-dev-net
      - momiji-llm-network
    depends_on:
      redis-dev:
        condition: service_healthy
    restart: unless-stopped

  momiji-frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: momiji-frontend-dev
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    environment:
      - BACKEND_HOST=momiji-clipper-dev
    ports:
      - "7861:80"
    depends_on:
      - momiji-clipper-dev
    networks:
      - momiji-dev-net
    restart: unless-stopped

networks:
  momiji-dev-net:
    name: momiji-dev-net
    driver: bridge
  momiji-llm-network:
    name: momiji-llm-network
    external: true
