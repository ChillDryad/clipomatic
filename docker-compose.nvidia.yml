# Nvidia GPU override — layer on top of prod or dev compose
# Example: docker compose -f docker-compose.prod.yml -f docker-compose.nvidia.yml -p momiji-prod --env-file .env.prod up -d

services:
  momiji-clipper-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
        REQUIREMENTS: requirements-cuda.txt
    runtime: nvidia
    environment:
      - WHISPER_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
