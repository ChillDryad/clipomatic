# Nvidia GPU override — layer on top of any environment compose
# Example: docker compose -f docker-compose.yml -f docker-compose.shared.yml -f docker-compose.prod.yml -f docker-compose.nvidia.yml -p momiji-prod --env-file .env.prod up -d

services:
  # Production GPU override
  momiji-clipper-prod:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
        REQUIREMENTS: requirements-cuda.txt
    runtime: nvidia
    environment:
      - WHISPER_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Development GPU override
  momiji-clipper-dev:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
        REQUIREMENTS: requirements-cuda.txt
    runtime: nvidia
    environment:
      - WHISPER_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Shared Ollama GPU override
  ollama-shared:
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
