# production environment — standalone compose file
# Ports: 7865 (frontend), 8001 (backend)
# Workspace: ./workspace-prod
# Prerequisite: Start shared Ollama first: docker compose -f docker-compose.shared.yml up -d
# Use with: docker compose -f docker-compose.prod.yml -p momiji-prod --env-file .env.prod up
# Or: ./scripts/start-prod.sh (runs attached for live logs)

services:
  momiji-clipper-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.10-slim
    container_name: momiji-clipper-prod
    environment:
      - WORKSPACE_DIR=/app/workspace
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_prodICE=${WHISPER_prodICE:-auto}
      - LLM_BASE_URL=http://ollama-shared:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=${LLM_MODEL:-gemma3:latest}
      - HIGHLIGHT_FALLBACK_MODEL=${HIGHLIGHT_FALLBACK_MODEL:-gemma3:latest}
      - LOCAL_LLM_MODELS=${LOCAL_LLM_MODELS:-gemma3:latest,gemma4:12b}
      - VISION_MODEL=${VISION_MODEL:-gemma3:latest}
      - VISION_SCAN_FPS=${VISION_SCAN_FPS:-1}
      - VISION_WINDOW_SECONDS=${VISION_WINDOW_SECONDS:-60}
      - VISION_MAX_FRAMES=${VISION_MAX_FRAMES:-360}
      - VISION_BATCH_SIZE=${VISION_BATCH_SIZE:-4}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
    volumes:
      - ./workspace-prod:/app/workspace
    networks:
      - momiji-llm-network
    restart: unless-stopped

  momiji-frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: momiji-frontend-prod
    environment:
      - BACKEND_HOST=momiji-clipper-prod
    ports:
      - "7865:80"
    depends_on:
      - momiji-clipper-prod
    networks:
      - momiji-llm-network
    restart: unless-stopped

networks:
  momiji-llm-network:
    external: true
    name: momiji-llm-network
