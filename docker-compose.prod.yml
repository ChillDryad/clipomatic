# Production environment — standalone compose file
# Ports: 7860 (frontend), 8000 (backend)
# Workspace: ./workspace
# Prerequisite: Start shared Ollama first: docker compose -f docker-compose.shared.yml up -d
# Use with: docker compose -f docker-compose.prod.yml -p momiji-prod --env-file .env.prod up -d
# Or: ./scripts/start-prod.sh

services:
  momiji-clipper-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.10-slim
    container_name: momiji-clipper-prod
    environment:
      - WORKSPACE_DIR=/app/workspace
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://momiji-ollama-shared:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
    volumes:
      - ./workspace:/app/workspace
    networks:
      - momiji-llm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  momiji-frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: momiji-frontend-prod
    environment:
      - BACKEND_HOST=momiji-clipper-prod
    ports:
      - "7860:80"
    depends_on:
      momiji-clipper-prod:
        condition: service_healthy
    networks:
      - momiji-llm-network
    restart: unless-stopped

networks:
  momiji-llm-network:
    external: true
    name: momiji-llm-network
