[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --cov=api --cov=auth --cov=db --cov=scheduler --cov=pipeline --cov=oauth --cov=platforms --cov-report=term-missing --cov-report=html:cov_html
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
