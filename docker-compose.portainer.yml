# Portainer stack for Clipomatic.
#
# Before deploying:
#   1. In Portainer, add ghcr.io as a registry using a GitHub PAT with `read:packages`.
#   2. Deploy this file as a Stack and set the required environment variables below.
#   3. Set IMAGE_TAG to a pinned `sha-...` tag for reproducible production deploys.
#
# This stack uses prebuilt linux/amd64 images from GHCR. It never builds source on the server.

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks: [clipomatic-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-384m}
    restart: unless-stopped

  # Keep this service when you want fully local general/vision LLMs.
  # For cloud highlight detection, set HIGHLIGHT_LLM_* in Portainer environment variables.
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-data:/root/.ollama
    networks: [clipomatic-internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-9g}
    restart: unless-stopped

  backend:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/clipomatic-backend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    environment: &app_environment
      WORKSPACE_DIR: /app/workspace
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/workspace/momiji.db}
      JWT_KEY_DIR: /app/workspace/.keys
      # First-run setup persists credentials under /app/workspace/.secrets.
      # Legacy OAUTH_ENCRYPTION_KEY is optional and gets migrated on first boot.
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      RAM_TIER: ${RAM_TIER:-standard}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      # Provider endpoint, models, and credentials are selected in browser setup.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      VISION_MODEL: ${VISION_MODEL:-gemma3:latest}
      VISION_SCAN_FPS: ${VISION_SCAN_FPS:-0.25}
      VISION_WINDOW_SECONDS: ${VISION_WINDOW_SECONDS:-120}
      VISION_MAX_FRAMES: ${VISION_MAX_FRAMES:-180}
      VISION_BATCH_SIZE: ${VISION_BATCH_SIZE:-2}
      HIGHLIGHT_CONTEXT_CARRYOVER: ${HIGHLIGHT_CONTEXT_CARRYOVER:-120}
      HIGHLIGHT_PRIORITY_WINDOW: ${HIGHLIGHT_PRIORITY_WINDOW:-30}
      HIGHLIGHT_PRIORITY_BOOST: ${HIGHLIGHT_PRIORITY_BOOST:-10}
      HIGHLIGHT_MAX_CLIP_DURATION: ${HIGHLIGHT_MAX_CLIP_DURATION:-120}
      CLIP_STUDIO_EXPORT_QUALITY: source
      CLIP_STUDIO_EXPORT_FORMAT: ${CLIP_STUDIO_EXPORT_FORMAT:-mp4}
      CLIP_STUDIO_INCLUDE_METADATA: ${CLIP_STUDIO_INCLUDE_METADATA:-true}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - clipomatic-workspace:/app/workspace
    networks: [clipomatic-internal]
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1g}
    restart: unless-stopped

  worker:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/clipomatic-backend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1} --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-1} --max-memory-per-child=${CELERY_MAX_MEMORY_KB:-2621440}
    environment: *app_environment
    volumes:
      - clipomatic-workspace:/app/workspace
    networks: [clipomatic-internal]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${CELERY_MEMORY_LIMIT:-3g}
    restart: unless-stopped

  frontend:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/clipomatic-frontend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    environment:
      BACKEND_HOST: backend
    ports:
      - "${PORT:-7865}:80"
    networks: [clipomatic-internal]
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-128m}
    restart: unless-stopped

networks:
  clipomatic-internal:
    driver: bridge

volumes:
  clipomatic-workspace:
  redis-data:
  ollama-data:
