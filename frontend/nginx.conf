server {
    listen 80;
    client_max_body_size 0;

    # React SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # API — disable buffering so SSE streams through immediately
    location /api/ {
        proxy_pass http://momiji-clipper:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Workspace static files (frames, renders)
    location /workspace/ {
        proxy_pass http://momiji-clipper:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
